 // bounds bounce

function update(){T++;G.time++;const p=G.p;
 if(bannerT>0)bannerT--;if(G.shake>0)G.shake*=.85;
 // move
 let mx=(keys.d?1:0)-(keys.a?1:0),my=(keys.s?1:0)-(keys.w?1:0);const ml=Math.hypot(mx,my)||1;const sp=3.1*clamp(p.speed,.3,2.2);

 const sm2=slowed?.5:1;p.vx=p.vx*0.6+mx/ml*sp*sm2*0.4;p.vy=p.vy*0.6+my/ml*sp*sm2*0.4;

 if(pressed[' '])useActive();
 if(pressed.e&&p.bombs>0){p.bombs--;G.bombs.push({x:p.x,y:p.y,t:90});}
 // doors
 const room=G.room;const open=room.cleared&&G.enemies.length===0;
 if(open&&!room.clearedFired){room.clearedFired=1;}
 [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const n=nbRoom(room,dx,dy);if(!n)return;
  const atDoor=(dx===1&&p.x>=RX+RW-p.r-1&&Math.abs(p.y-(RY+RH/2))<34&&mx>0)||(dx===-1&&p.x<=RX+p.r+1&&Math.abs(p.y-(RY+RH/2))<34&&mx<0)||
   (dy===1&&p.y>=RY+RH-p.r-1&&Math.abs(p.x-(RX+RW/2))<34&&my>0)||(dy===-1&&p.y<=RY+p.r+1&&Math.abs(p.x-(RX+RW/2))<34&&my<0);
  if(atDoor&&open){if(n.locked){if(p.keys>0){p.keys--;n.locked=false;G.fx.push({t:30,txt:'UNLOCKED',x:p.x,y:p.y-30});}else return;}enterRoom(n,[dx,dy]);}});
 // tears
 for(const t of G.tears){t.t++;
  if(t.homing){let best=null,bd=260;for(const e of G.enemies){if(e.charm>0||e.hidden>.6)continue;const d=dist(t,e);if(d<bd){bd=d;best=e;}}
   if(best){const a=ang(t,best),s=Math.hypot(t.vx,t.vy);const ca=Math.atan2(t.vy,t.vx);let d=a-ca;while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;const na=ca+clamp(d,-.12,.12);t.vx=Math.cos(na)*s;t.vy=Math.sin(na)*s;}}
  if(t.spiral){const ca=Math.atan2(t.vy,t.vx)+0.05,s=Math.hypot(t.vx,t.vy);t.vx=Math.cos(ca)*s;t.vy=Math.sin(ca)*s;}

  if(t.y<RY||t.y>RY+RH){if(t.bounce&&!t.bounced2){t.vy*=-1;t.y=clamp(t.y,RY,RY+RH);t.bounced2=(t.bounced2||0)+.5;}else t.life=0;}

  const ic={boss:'#e22',item:'#fd3',shop:'#3c6'}[r.type];if(ic&&(r.seen||p.f.map)){ctx.fillStyle=ic;ctx.fillRect(x+cs/2-5,y+1,6,ch-4);}}}

 // enemy heads peeking

 ens.forEach((p,i)=>{ctx.save();ctx.globalAlpha=.55;const x=i<2?40+i*70:W-40-(i-2)*70,y=330+Math.sin(T*.03+i)*12;drawFrame(img(p),2,Math.floor(T/20),x,y,56,true);ctx.restore();});
 // logo

 txt('THE',0,-78,40,'#e8d8b8');
 ctx.font='96px Impact, "Arial Black", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 for(let i=6;i>0;i--){ctx.fillStyle=`rgba(${80+i*20},0,0,.6)`;ctx.fillText('BINDING',i,i*1.2);}
 const g=ctx.createLinearGradient(0,-50,0,50);g.addColorStop(0,'#f2e6c8');g.addColorStop(.5,'#d8b878');g.addColorStop(1,'#8a2010');
 ctx.lineWidth=10;ctx.strokeStyle='#1a0404';ctx.strokeText('BINDING',0,0);ctx.fillStyle=g;ctx.fillText('BINDING',0,0);
 // drips
 ctx.fillStyle='#8a0c0c';for(let i=0;i<9;i++){const x=-180+i*45,len=(Math.sin(T*.02+i*2.1)*.5+.5)*24+6;ctx.fillRect(x,40,5,len);ctx.beginPath();ctx.arc(x+2.5,40+len,4,0,7);ctx.fill();}
 txt('OF',0,70,34,'#e8d8b8');
 ctx.save();ctx.translate(0,128);const s=1+Math.sin(T*.12)*.04;ctx.scale(s,s);ctx.rotate(Math.sin(T*.07)*.03);
 ctx.font='84px Impact, "Arial Black", sans-serif';ctx.lineWidth=12;ctx.strokeStyle='#000';ctx.strokeText('ASHAAD',0,0);
 const g2=ctx.createLinearGradient(-200,0,200,0);const h=(T*2)%360;g2.addColorStop(0,`hsl(${h},90%,60%)`);g2.addColorStop(.5,`hsl(${(h+120)%360},90%,60%)`);g2.addColorStop(1,`hsl(${(h+240)%360},90%,60%)`);
 ctx.fillStyle=g2;ctx.fillText('ASHAAD',0,0);ctx.restore();ctx.restore();
 // ashaad
 const ay=430+Math.sin(T*.06)*8;const gl=ctx.createRadialGradient(W/2,ay,10,W/2,ay,120);gl.addColorStop(0,'rgba(255,200,90,.35)');gl.addColorStop(1,'rgba(255,200,90,0)');ctx.fillStyle=gl;ctx.fillRect(W/2-130,ay-130,260,260);
 shadow(W/2,500,46);drawAshaad(W/2,ay,144,T*.1,1,1,true);
 // tears falling from eyes vibe
 txt('a brainrot roguelike',W/2,322,22,'#c9a878','center','#000','Georgia, serif');
 if(Math.floor(T/30)%2===0)txt('PRESS ENTER TO START',W/2,560,32,'#fff');
 txt('WASD move · ARROWS shoot · SPACE active · E bomb · R restart',W/2,612,17,'#a89878','center','#000','monospace');
 txt('v1.0 · certified Ohio edition',W/2,648,13,'#6a5a48','center',null,'monospace');}

// ---------- death / victory ----------
function drawDead(){drawGame();ctx.fillStyle=`rgba(0,0,0,${Math.min(.8,T/60)})`;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-.04);ctx.fillStyle='#e8dcc0';ctx.fillRect(-260,-170,520,340);ctx.strokeStyle='#3a2410';ctx.lineWidth=6;ctx.strokeRect(-260,-170,520,340);
 txt('YOU GOT MOGGED',0,-120,44,'#7a0c0c','center',null);txt('Ashaad has lost all aura.',0,-74,20,'#3a2410','center',null,'Georgia, serif');
 ctx.save();ctx.rotate(Math.PI/2);drawAshaad(0,0,96,0,1,1,false);ctx.restore();
 txt(`Killed by: ${G.room.type==='boss'?'Landry the Snake':'a Julian'}   Kills: ${G.kills}   Items: ${G.p.items.length}`,0,90,16,'#3a2410','center',null,'Georgia, serif');
 txt('Press R to run it back',0,130,24,'#2a1608','center',null);ctx.restore();}
let confetti=[];
function drawVictory(){ctx.fillStyle='#0a0606';ctx.fillRect(0,0,W,H);ctx.globalAlpha=.4;ctx.drawImage(floorCache,0,0,W,H-HUD,0,0,W,H);ctx.globalAlpha=1;
 const rays=ctx.createRadialGradient(W/2,300,20,W/2,300,500);rays.addColorStop(0,'rgba(255,220,120,.45)');rays.addColorStop(1,'rgba(0,0,0,.7)');ctx.fillStyle=rays;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2,300);ctx.rotate(T*.004);ctx.fillStyle='rgba(255,230,150,.08)';for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(600,-60);ctx.lineTo(600,60);ctx.fill();}ctx.restore();
 if(T%2===0)for(let i=0;i<3;i++)confetti.push({x:rnd(W),y:-10,vx:rnd(-1,1),vy:rnd(2,4),c:pick(['#f4c','#4cf','#fd3','#6f6','#f64']),a:rnd(6)});
 for(const c of confetti){c.x+=c.vx;c.y+=c.vy;c.a+=.1;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.fillStyle=c.c;ctx.fillRect(-4,-2,8,4);ctx.restore();}confetti=confetti.filter(c=>c.y<H+10);
 const s=1+Math.sin(T*.1)*.05;ctx.save();ctx.translate(W/2,90);ctx.scale(s,s);txt('LANDRY HAS BEEN MOGGED',0,0,58,'#fd3');ctx.restore();
 txt('+ 1,000,000 AURA',W/2,150,30,'#6f6');
 // knocked out snake
 const head=img('landry_snake_anim.png');ctx.save();ctx.translate(W/2+200,400);ctx.rotate(Math.PI/2.4);drawFrame(head,4,1,0,0,110,true);ctx.restore();txt('x  x',W/2+200,330,22,'#fff');
 // dancing ashaad
 const hop=Math.abs(Math.sin(T*.15))*30;shadow(W/2-120,470,40);ctx.save();ctx.translate(W/2-120,420-hop);ctx.rotate(Math.sin(T*.15)*.15);drawAshaad(0,0,128,T*.2,Math.sin(T*.075)>0?1:-1,1,true);ctx.restore();
 const m=Math.floor(G.time/3600),sec=Math.floor(G.time/60)%60;
 txt(`Time ${m}:${String(sec).padStart(2,'0')}    Kills ${G.kills}    Items ${G.p.items.length}    Coins ${G.p.coins}`,W/2,540,20,'#e8d8b8','center','#000','monospace');
 if(Math.floor(T/30)%2===0)txt('PRESS ENTER TO CONTINUE',W/2,600,28,'#fff');}

// ---------- cutscene ----------
const PANELS=[
 {cap:'Once upon a time, in a basement in Ohio, lived a boy named Ashaad. His aura was dangerously high.',draw:t=>{sceneRoom();drawAshaad(480,300,120,0,1,1,false);for(let i=0;i<5;i++)txt('+AURA',300+i*90,160+Math.sin(t*.1+i)*10,20,'#fd3');}},
 {cap:'But the Julians wanted his rizz. ALL of them. Every single enemy was Julian. Nobody knows why.',draw:t=>{sceneRoom();drawAshaad(480,320,96,t*.15,1,1,true);
  ['fly','sigma','gyatt','rizzler','skibidi'].forEach((k,i)=>{const a=i/5*6.28+t*.01;drawFrame(img(ETYPES[k].img),2,Math.floor(t/14),480+Math.cos(a)*240,300+Math.sin(a)*120,80,true);});}},
 {cap:'Deep below waited Landry the Snake, gatekeeper of the exit, who would not stop yapping.',draw:t=>{sceneRoom('#1a0a0a');for(let i=10;i>0;i--){const im=img('landry_snake_segment.png');if(im){ctx.imageSmoothingEnabled=true;ctx.drawImage(im,300+i*40,330+Math.sin(t*.08+i*.7)*20,46,46);}}
  drawFrame(img('landry_snake_anim.png'),4,Math.floor(t/25)%2,330,310,140,true);txt('yap yap yap',600,170,26,'#4e2');}},
 {cap:'So Ashaad locked in. He mewed. He mogged. He hit the griddy on the snake\'s head.',draw:t=>{sceneRoom('#200808');ctx.save();ctx.translate(560,360);ctx.rotate(1.3);drawFrame(img('landry_snake_anim.png'),4,1,0,0,140,true);ctx.restore();
  const hop=Math.abs(Math.sin(t*.15))*40;drawAshaad(360,300-hop,120,t*.25,1,1,true);txt('MOG!',480,140,50,'#f33');}},
 {cap:'He climbed out of the basement into the sunlight and touched grass for the first time. +1000 aura.',draw:t=>{const g=ctx.createLinearGradient(0,60,0,460);g.addColorStop(0,'#7cc8f0');g.addColorStop(1,'#e8f4c8');ctx.fillStyle=g;ctx.fillRect(100,60,760,400);
  ctx.fillStyle='#fd6';ctx.beginPath();ctx.arc(760,140,40,0,7);ctx.fill();ctx.fillStyle='#4a9a3a';ctx.fillRect(100,360,760,100);
  for(let i=0;i<70;i++){ctx.fillStyle=i%2?'#3a8a2a':'#5aba4a';const x=104+i*11;ctx.beginPath();ctx.moveTo(x,362);ctx.lineTo(x+4,346+Math.sin(t*.1+i)*4);ctx.lineTo(x+8,362);ctx.fill();}
  ctx.fillStyle='#000';ctx.fillRect(200,370,90,30);drawAshaad(480,320,120,t*.12,1,1,true);}},
 {cap:'...but far away, in a distant toilet, something began to sing. Brrr skibidi dop dop. THE END?',draw:t=>{sceneRoom('#050510');const up=Math.max(0,Math.min(1,(t-40)/60));
  ctx.fillStyle='#ddd';ctx.beginPath();ctx.ellipse(480,380,110,36,0,0,7);ctx.fill();ctx.fillStyle='#2a5a80';ctx.beginPath();ctx.ellipse(480,380,86,26,0,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.rect(300,60,360,320);ctx.clip();drawFrame(img(ETYPES.skibidi.img),2,Math.floor(t/14),480,380-up*150,180,true);ctx.restore();}},
];
let cut={i:0,t:0};
function sceneRoom(col='#2a1810'){ctx.fillStyle=col;ctx.fillRect(100,60,760,400);ctx.globalAlpha=.5;ctx.drawImage(floorCache,RX,WALL,RW,RH,100,60,760,400);ctx.globalAlpha=1;
 const v=ctx.createRadialGradient(480,260,60,480,260,420);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.8)');ctx.fillStyle=v;ctx.fillRect(100,60,760,400);}
function wrap(s,x,y,maxW,lh,size){ctx.font=`${size}px Georgia, serif`;const words=s.split(' ');let line='',yy=y;for(const w of words){const t=line+w+' ';if(ctx.measureText(t).width>maxW&&line){txt(line.trim(),x,yy,size,'#2a1608','center',null,'Georgia, serif');line=w+' ';yy+=lh;}else line=t;}txt(line.trim(),x,yy,size,'#2a1608','center',null,'Georgia, serif');}
function drawCutscene(){cut.t++;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const P=PANELS[cut.i];
 // parchment page
 ctx.fillStyle='#d9c9a3';ctx.fillRect(60,30,840,610);ctx.strokeStyle='#5a3a20';ctx.lineWidth=4;ctx.strokeRect(72,42,816,586);
 ctx.save();ctx.beginPath();ctx.rect(100,60,760,400);ctx.clip();P.draw(cut.t);
 ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(200,160,100,.45)';ctx.fillRect(100,60,760,400);ctx.restore();
 ctx.strokeStyle='#2a1608';ctx.lineWidth=6;ctx.strokeRect(100,60,760,400);
 const fade=Math.min(1,cut.t/30);ctx.globalAlpha=fade;wrap(P.cap,480,510,700,34,26);ctx.globalAlpha=1;
 txt(`${cut.i+1} / ${PANELS.length}`,860,612,14,'#5a3a20','right',null,'monospace');txt('ENTER next · ESC skip',100,612,14,'#5a3a20','left',null,'monospace');
 if(cut.t<20){ctx.fillStyle=`rgba(0,0,0,${1-cut.t/20})`;ctx.fillRect(0,0,W,H);}
 if(cut.t>330)nextPanel();}
function nextPanel(){cut.i++;cut.t=0;if(cut.i>=PANELS.length){state='credits';credY=H+20;}}

// ---------- credits ----------
const CREDITS=[['h','THE BINDING OF ASHAAD'],['',''],['s','Created by'],['b','Landry Chang'],['',''],['s','Starring'],['b','Ashaad'],['',''],['s','Julian as'],['b','every single enemy'],['s','(fly, skibidi, sigma, rizzler and gyatt)'],['',''],['s','Landry as'],['b','the snake'],['',''],
 ['s','Aura Consultant'],['b','Literally nobody'],['s','Fanum Tax Collector'],['b','Fanum'],['s','Mewing Coach'],['b','The jawline itself'],['s','Ohio Location Scout'],['b','Unknown (never returned)'],['',''],
 ['s','No Julians were harmed. Most of them were mogged.'],['s','Rizz coins have no real-world value. Sorry.'],['s','This game was certified bussin by the Skibidi Council.'],['',''],['h','THANKS FOR PLAYING'],['s','touch grass now  ·  press ENTER'],];
let credY=H;
function drawCredits(){ctx.fillStyle='#050303';ctx.fillRect(0,0,W,H);[[60,640,60,1],[W-60,640,60,3]].forEach(([x,y,h,s])=>drawCandle(x,y,h,s));
 credY-=1.1;let y=credY;for(const [k,s] of CREDITS){if(k==='h')txt(s,W/2,y,46,'#fd3');else if(k==='b')txt(s,W/2,y,34,'#fff');else if(k==='s')txt(s,W/2,y,20,'#c9a878','center',null,'Georgia, serif');y+=k==='h'?70:k==='b'?52:k===''?30:34;}
 drawAshaad(W-150,H-120,72,T*.15,-1,1,true);
 if(y<-20)credY=H;
 const g=ctx.createLinearGradient(0,0,0,100);g.addColorStop(0,'#050303');g.addColorStop(1,'rgba(5,3,3,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,100);}

// ---------- main loop ----------
function frame(){
 if(state==='loading'){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);txt('Loading aura...',W/2,H/2,30);}
 else if(state==='title'){T++;drawTitle();if(pressed.Enter||pressed[' ']){newGame();}}
 else if(state==='play'){update();drawGame();if(pressed.r)newGame();}
 else if(state==='dead'){T++;drawDead();if(pressed.r||pressed.Enter&&T>60)newGame();}
 else if(state==='victory'){T++;drawVictory();if(pressed.Enter&&T>30){state='cutscene';cut={i:0,t:0};}if(pressed.r)newGame();}
 else if(state==='cutscene'){T++;drawCutscene();if(pressed.Enter||pressed[' '])nextPanel();if(pressed.Escape){state='credits';credY=H+20;}}
 else if(state==='credits'){T++;drawCredits();if(pressed.Enter||pressed.Escape){state='title';T=0;}if(pressed.r)newGame();}
 pressed={};requestAnimationFrame(frame);}
ctx.imageSmoothingEnabled=false;
loadAssets(()=>{buildRoomCaches();state='title';});
requestAnimationFrame(frame);

// ---------- debug / test hooks ----------
window.BOA={get state(){return state;},set state(s){state=s;T=0;},get G(){return G;},newGame,
 gotoRoom(type){const r=G.rooms.find(r=>r.type===type);G.p.x=RX+RW/2;G.p.y=RY+RH-60;enterRoom(r,null);},
 give(name){const it=ITEMS.find(i=>i.name===name);if(it)grantItem(it);},
 killAll(){for(const e of G.enemies)hurtEnemy(e,99999);},
 victory(){state='victory';T=0;},cutscene(i=0){state='cutscene';cut={i,t:40};},credits(y){state='credits';credY=y||H;}};
</script></body></html>
